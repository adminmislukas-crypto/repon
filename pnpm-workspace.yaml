packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
# Expo's web dev server (Metro + @expo/router-server + friends) assumes
# classic hoisted node_modules resolution — it requires transitive
# dependencies (expo-modules-core, @expo/log-box, debug, @react-native/
# normalize-colors, etc.) that pnpm's default isolated linker deliberately
# does not expose unless a package declares them directly. This is the fix
# Expo's own docs recommend for pnpm monorepos. On this pnpm version
# (11.17.0), node-linker moved from .npmrc to pnpm-workspace.yaml — a plain
# `.npmrc` with `node-linker=hoisted` is silently ignored (verified: `pnpm
# config get node-linker` stayed undefined and node_modules/.modules.yaml
# still reported nodeLinker: isolated after a full reinstall). Trade-off:
# workspace-wide, including the backend domains — pnpm's "phantom
# dependency" protection (an undeclared-but-resolvable import silently
# working) is lost everywhere, not just in apps/usuario-mobile.
nodeLinker: hoisted
allowBuilds:
  # unrs-resolver is eslint-plugin-import-x's native (Rust) module resolver —
  # required for the cross-domain import boundary rule in eslint.config.js to
  # actually resolve import specifiers to file paths. Approved deliberately,
  # not a supply-chain risk (well-known package, no unexpected postinstall).
  # @scarf/scarf is swagger-ui-dist's (transitive via @nestjs/swagger, PR 3)
  # anonymous-usage-telemetry postinstall script. Denied deliberately — we
  # want swagger-ui-dist's static assets, not its phone-home script; blocking
  # the build script doesn't affect swagger-ui functionality.
  '@scarf/scarf': false
  # esbuild is tsx's (PR 3, `start:dev`) and ts-jest's transitive native
  # binary — its postinstall fetches the correct platform build. Required
  # for both to function at all; not optional like the two entries above.
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.66.0'
  - '@typescript-eslint/parser@8.66.0'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/scope-manager@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/type-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/utils@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - typescript-eslint@8.66.0
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo-router@57.0.14
  - expo-splash-screen@57.0.7
  - expo@57.0.14
