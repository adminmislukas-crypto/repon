# apps/usuario-mobile — static server for Expo Router's `web.output: "static"`
# export (one HTML file per route, e.g. `dist/login.html`). Direct navigation
# and hard refreshes on a nested route need the extension-less URL resolved
# to its `.html` file; unknown paths fall back to `index.html` so client-side
# routing (expo-router's <Link>) still works for any route Metro didn't
# pre-render as its own file.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static assets: hashed filenames, safe to cache aggressively.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    error_page 404 /404.html;
}
