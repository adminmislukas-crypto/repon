# apps/proveedor-mobile — static server for Expo Router's `web.output: "static"`
# export. See apps/usuario-mobile/nginx.conf for the full rationale — this is
# the same config, mirrored per app so each image is self-contained.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    error_page 404 /404.html;
}
