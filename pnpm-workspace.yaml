packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
allowBuilds:
  # unrs-resolver is eslint-plugin-import-x's native (Rust) module resolver —
  # required for the cross-domain import boundary rule in eslint.config.js to
  # actually resolve import specifiers to file paths. Approved deliberately,
  # not a supply-chain risk (well-known package, no unexpected postinstall).
  # @scarf/scarf is swagger-ui-dist's (transitive via @nestjs/swagger, PR 3)
  # anonymous-usage-telemetry postinstall script. Denied deliberately — we
  # want swagger-ui-dist's static assets, not its phone-home script; blocking
  # the build script doesn't affect swagger-ui functionality.
  '@scarf/scarf': false
  # esbuild is tsx's (PR 3, `start:dev`) and ts-jest's transitive native
  # binary — its postinstall fetches the correct platform build. Required
  # for both to function at all; not optional like the two entries above.
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.66.0'
  - '@typescript-eslint/parser@8.66.0'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/scope-manager@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/type-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/utils@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - typescript-eslint@8.66.0
