schema: spec-driven

context: |
  Tech stack: RN+Expo (usuario-mobile, proveedor-mobile) w/ NativeWind, TanStack Query,
  Zustand; Next.js App Router (admin-web); NestJS modular monolith (core-api), hexagonal
  per domain. Supabase (Auth/Postgres/Storage/Realtime) as pure infra, not business logic.
  Architecture: hexagonal per domain (identidad, catalogo, consumo, refill-matching,
  ofertas, pedidos-pagos), event-driven via EventEmitter2 today, extractable to
  microservices per-domain later without touching business rules.
  Testing: CONFIGURED (`backend-core-api-foundation`, PRs 1-9) — pnpm workspaces +
  TypeScript strict + ESLint (incl. a cross-domain import boundary rule) + Jest
  (unit/e2e/opt-in-integration) + GitHub Actions CI, exercised across 9 PRs;
  `services/core-api` is the only workspace project with real runtime code so far
  (`identidad` fully implemented, 5 domains as thin placeholder modules per D2).
  `apps/*` are still HTML mockups, pre-implementation — this testing setup does not
  yet cover them.
  Style: every app/domain/package already has a product-level SPEC.md (pre-existing
  convention, NOT SDD-generated); docs/ARCHITECTURE.md + docs/DATA_MODEL.md at root are
  the canonical references and MUST be read before touching data model or service
  boundaries.

strict_tdd: true

testing:
  status: configured
  reason: >-
    `backend-core-api-foundation` (D7, tasks.md 5.6) stood up a real toolchain and
    verified it green locally across 9 PRs: pnpm workspace root scripts fan out to
    every package via `pnpm -r --if-present`, `services/core-api` runs Jest (111 unit +
    17 e2e tests, PR 9 snapshot) via `ts-jest`, and `.github/workflows/ci.yml` gates
    install -> lint -> typecheck -> test -> build on every step passing (PR 1). Coverage
    reporting exists (`collectCoverageFrom`) but no threshold is enforced yet — left at
    0 deliberately, not silently omitted; raising it is a future call, not implied by
    "testing is configured".
  test_command: "pnpm test"
  build_command: "pnpm build"
  lint_command: "pnpm lint"
  typecheck_command: "pnpm typecheck"
  format_command: "pnpm format:check"
  coverage_threshold: 0

rules:
  proposal:
    - Read docs/ARCHITECTURE.md and docs/DATA_MODEL.md before proposing changes to data model or service boundaries
    - Read the relevant app/domain/package SPEC.md first — it is a pre-existing contract, not something SDD owns; flag conflicts instead of silently overriding it
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Delta specs MUST NOT silently contradict the existing product-level SPEC.md files — flag conflicts explicitly instead
  design:
    - Respect hexagonal boundaries: a domain only talks to infrastructure through the ports declared in its SPEC.md
    - Client apps call core-api for business logic; no direct Supabase business-logic access from usuario-mobile/proveedor-mobile/admin-web
    - Document architecture decisions with rationale
    - Include sequence diagrams for complex flows (e.g. refill -> matching -> offer -> order)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - `services/core-api` has a real test runner now (Jest, `backend-core-api-foundation`); for every OTHER sub-project still without one (`apps/*`, `packages/ui`), the FIRST tasks that introduce real code MUST include scaffolding an appropriate test runner (Jest/Vitest for Next.js, Jest + RNTL for the Expo apps) before or alongside the feature code
  apply:
    - Follow existing SPEC.md naming and domain language (Spanish entity/event names, e.g. RefillRequest, OfertaAceptada)
    - Never implement a physical DELETE on usuarios/empresas/productos — use the `status` field (soft delete) per docs/ARCHITECTURE.md "Principio de dar de baja"
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
